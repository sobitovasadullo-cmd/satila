<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salına · QR Kod</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #04161d; color: #e6f1ec;
         font-family: "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #0a2630; border: 1px solid #1b4552; border-radius: 18px; padding: 28px; text-align: center; max-width: 420px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .04em; } h1 span { color: #e2c67a; }
  p { color: #8fb0aa; margin: 0 0 20px; }
  #qr { background: #fff; padding: 18px; border-radius: 12px; display: inline-block; }
  #qr img, #qr canvas { display: block; width: 280px; height: 280px; max-width: 70vw; max-height: 70vw; }
  .url { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #6fd3f0; margin: 16px 0; }
  a.btn { display: inline-block; background: #e2c67a; color: #04161d; padding: 10px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>SALI<span>NA</span></h1>
  <p>Telefon kamerasıyla okut, 3D modeli aç</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <a class="btn" id="dl" download="salina-qr.png" href="#">QR’ı PNG indir</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Bu sayfanın bulunduğu klasördeki index.html adresini QR yapar
  const site = new URL('./', location.href).href;
  document.getElementById('url').textContent = site;
  new QRCode(document.getElementById('qr'), { text: site, width: 560, height: 560, colorDark: '#04161d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  setTimeout(() => {
    const c = document.querySelector('#qr canvas');
    if (c) document.getElementById('dl').href = c.toDataURL('image/png');
  }, 300);
</script>
</body>
</html>
